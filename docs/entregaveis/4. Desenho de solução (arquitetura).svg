<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="760" viewBox="0 0 1400 760" font-family="Helvetica, Arial, sans-serif">
<rect width="1400" height="760" fill="#ffffff"/>
<defs><marker id="m" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#555"/></marker></defs>
<text x="700.0" y="36" text-anchor="middle" font-size="16" font-weight="bold">Vita — bem-estar financeiro com IA · desenho de solução (estado em 27/09/2026, projeto do evento no Google Cloud)</text>
<rect x="20" y="60" width="300" height="230" rx="8" fill="#FAFAFA" stroke="#BDBDBD"/>
<text x="28" y="77" font-size="13" font-weight="bold">Canal (cliente)</text>
<rect x="340" y="60" width="720" height="420" rx="8" fill="#FAFAFA" stroke="#BDBDBD"/>
<text x="348" y="77" font-size="13" font-weight="bold">Agente · Cloud Run + ADK 2.8</text>
<rect x="1080" y="60" width="300" height="230" rx="8" fill="#FAFAFA" stroke="#BDBDBD"/>
<text x="1088" y="77" font-size="13" font-weight="bold">Modelo</text>
<rect x="340" y="500" width="720" height="200" rx="8" fill="#FAFAFA" stroke="#BDBDBD"/>
<text x="348" y="517" font-size="13" font-weight="bold">Dados e conhecimento</text>
<rect x="1080" y="310" width="300" height="390" rx="8" fill="#FAFAFA" stroke="#BDBDBD"/>
<text x="1088" y="327" font-size="13" font-weight="bold">Observabilidade e experimentação</text>
<rect x="20" y="310" width="300" height="390" rx="8" fill="#FAFAFA" stroke="#BDBDBD" stroke-dasharray="6,4"/>
<text x="28" y="327" font-size="13" font-weight="bold">Caminho de produção (desenhado)</text>
<rect x="40" y="95" width="260" height="60" rx="8" fill="#E8F5EE" stroke="#1F7A4D"/>
<text x="170.0" y="122.0" text-anchor="middle" font-size="11" font-weight="bold">Push proativo na tela bloqueada</text>
<text x="170.0" y="136.0" text-anchor="middle" font-size="11">gatilho: 3 faturas seguidas sem pagamento integral</text>
<rect x="40" y="170" width="260" height="100" rx="8" fill="#E8F5EE" stroke="#1F7A4D"/>
<text x="170.0" y="203.0" text-anchor="middle" font-size="11" font-weight="bold">App Vita (React, Cloud Run) → chat e telas pela API do agente</text>
<text x="170.0" y="217.0" text-anchor="middle" font-size="11">abertura pré-montada pelo pipeline · fatura · visão financeira</text>
<text x="170.0" y="231.0" text-anchor="middle" font-size="11">tratamentos · confirmação com iToken · falar com uma pessoa</text>
<text x="170.0" y="245.0" text-anchor="middle" font-size="11">nenhum número escrito no front, nenhuma chave de modelo</text>
<rect x="360" y="190" width="300" height="55" rx="8" fill="#E8F5EE" stroke="#1F7A4D"/>
<text x="510.0" y="214.5" text-anchor="middle" font-size="11" font-weight="bold">Orquestrador (LlmAgent raiz)</text>
<text x="510.0" y="228.5" text-anchor="middle" font-size="11">roteia, conversa e monta a resposta com ações do catálogo</text>
<rect x="360" y="260" width="140" height="65" rx="8" fill="#E8F5EE" stroke="#1F7A4D"/>
<text x="430.0" y="282.5" text-anchor="middle" font-size="11" font-weight="bold">Analista</text>
<text x="430.0" y="296.5" text-anchor="middle" font-size="11">situação do cliente</text>
<text x="430.0" y="310.5" text-anchor="middle" font-size="11">(só via tools)</text>
<rect x="515" y="260" width="140" height="65" rx="8" fill="#E8F5EE" stroke="#1F7A4D"/>
<text x="585.0" y="282.5" text-anchor="middle" font-size="11" font-weight="bold">Educador</text>
<text x="585.0" y="296.5" text-anchor="middle" font-size="11">conceitos</text>
<text x="585.0" y="310.5" text-anchor="middle" font-size="11">(base local)</text>
<rect x="670" y="190" width="370" height="55" rx="8" fill="#E8F5EE" stroke="#1F7A4D"/>
<text x="855.0" y="214.5" text-anchor="middle" font-size="11" font-weight="bold">Especialista em normas (AgentTool, modelo próprio)</text>
<text x="855.0" y="228.5" text-anchor="middle" font-size="11">busca no corpus curado; toda resposta cita a fonte</text>
<rect x="670" y="260" width="370" height="65" rx="8" fill="#E8F5EE" stroke="#1F7A4D"/>
<text x="855.0" y="282.5" text-anchor="middle" font-size="11" font-weight="bold">Pipeline proativo (SequentialAgent)</text>
<text x="855.0" y="296.5" text-anchor="middle" font-size="11">diagnóstico por tools → redator com schema {texto, ações}</text>
<text x="855.0" y="310.5" text-anchor="middle" font-size="11">abertura validada e pré-montada na sessão</text>
<rect x="360" y="95" width="680" height="80" rx="8" fill="#E8F5EE" stroke="#1F7A4D"/>
<text x="700.0" y="118.0" text-anchor="middle" font-size="11" font-weight="bold">Guardrails transversais (plugin em todos os agentes, sem LLM)</text>
<text x="700.0" y="132.0" text-anchor="middle" font-size="11">entrada: normalização, desofuscação, PII mascarada, injeção, outro cliente, escopo, identidade, risco à vida</text>
<text x="700.0" y="146.0" text-anchor="middle" font-size="11">tools: id do cliente só da sessão · faixa V nunca chega na tool de crédito</text>
<text x="700.0" y="160.0" text-anchor="middle" font-size="11">saída: número só do payload das tools, termos proibidos, canário, fonte obrigatória, uma regeneração e resposta segura</text>
<rect x="360" y="340" width="680" height="120" rx="8" fill="#E8F5EE" stroke="#1F7A4D"/>
<text x="700.0" y="383.0" text-anchor="middle" font-size="11" font-weight="bold">Tools determinísticas e motor de decisão (Python tipado, sem LLM)</text>
<text x="700.0" y="397.0" text-anchor="middle" font-size="11">fatura reconstruída por regra · perfil de risco (faixas A/B/C/V) · Índice de Organização Financeira (4 pilares)</text>
<text x="700.0" y="411.0" text-anchor="middle" font-size="11">T01 usar a reserva (CDI do Banco Central, IR) · T02 parcelar (tabela Price, regra de atenção) · ofertas por faixa</text>
<text x="700.0" y="425.0" text-anchor="middle" font-size="11">motor: ordena pelo custo mensal real · confirmação idempotente com iToken · memória só com consentimento</text>
<rect x="1100" y="95" width="260" height="90" rx="8" fill="#E8F5EE" stroke="#1F7A4D"/>
<text x="1230.0" y="123.0" text-anchor="middle" font-size="11" font-weight="bold">Gemini · Vertex AI (us-central1)</text>
<text x="1230.0" y="137.0" text-anchor="middle" font-size="11">via conta de serviço, sem chave</text>
<text x="1230.0" y="151.0" text-anchor="middle" font-size="11">papéis em modelos diferentes:</text>
<text x="1230.0" y="165.0" text-anchor="middle" font-size="11">orquestrador, especialista, redator</text>
<rect x="1100" y="200" width="260" height="75" rx="8" fill="#E8F5EE" stroke="#1F7A4D"/>
<text x="1230.0" y="227.5" text-anchor="middle" font-size="11" font-weight="bold">LLM como juiz (só tom e clareza)</text>
<text x="1230.0" y="241.5" text-anchor="middle" font-size="11">rubrica; nunca decide número</text>
<text x="1230.0" y="255.5" text-anchor="middle" font-size="11">usado na avaliação offline</text>
<rect x="360" y="535" width="210" height="70" rx="8" fill="#E8F5EE" stroke="#1F7A4D"/>
<text x="465.0" y="560.0" text-anchor="middle" font-size="11" font-weight="bold">BigQuery (base do evento)</text>
<text x="465.0" y="574.0" text-anchor="middle" font-size="11">extrato sintético de 1.000 clientes</text>
<text x="465.0" y="588.0" text-anchor="middle" font-size="11">+ tabelas do time (vita_sintetico)</text>
<rect x="590" y="535" width="210" height="70" rx="8" fill="#E8F5EE" stroke="#1F7A4D"/>
<text x="695.0" y="560.0" text-anchor="middle" font-size="11" font-weight="bold">Snapshot na imagem</text>
<text x="695.0" y="574.0" text-anchor="middle" font-size="11">fatura mensal, perfil de risco,</text>
<text x="695.0" y="588.0" text-anchor="middle" font-size="11">bioimpedância, investimentos, parâmetros</text>
<rect x="820" y="535" width="220" height="70" rx="8" fill="#E8F5EE" stroke="#1F7A4D"/>
<text x="930.0" y="567.0" text-anchor="middle" font-size="11" font-weight="bold">CDI · SGS do Banco Central</text>
<text x="930.0" y="581.0" text-anchor="middle" font-size="11">parâmetro com origem e data</text>
<rect x="360" y="620" width="330" height="65" rx="8" fill="#E8F5EE" stroke="#1F7A4D"/>
<text x="525.0" y="642.5" text-anchor="middle" font-size="11" font-weight="bold">Corpus de normas do especialista (8 fontes, 24 trechos)</text>
<text x="525.0" y="656.5" text-anchor="middle" font-size="11">Res. CMN 4.549/2017, Lei 14.690/2023, Lei 14.181/2021…</text>
<text x="525.0" y="670.5" text-anchor="middle" font-size="11">trecho com injeção é barrado na indexação</text>
<rect x="710" y="620" width="330" height="65" rx="8" fill="#E8F5EE" stroke="#1F7A4D"/>
<text x="875.0" y="642.5" text-anchor="middle" font-size="11" font-weight="bold">Memória de longo prazo (SQLite), lida pelas tools</text>
<text x="875.0" y="656.5" text-anchor="middle" font-size="11">chaves permitidas, sem valor de transação</text>
<text x="875.0" y="670.5" text-anchor="middle" font-size="11">consentimento explícito · TTL · esqueça tudo</text>
<rect x="1100" y="345" width="260" height="80" rx="8" fill="#E8F5EE" stroke="#1F7A4D"/>
<text x="1230.0" y="368.0" text-anchor="middle" font-size="11" font-weight="bold">Cloud Logging (JSON, dos guardrails e do orquestrador)</text>
<text x="1230.0" y="382.0" text-anchor="middle" font-size="11">event=guard: camada, categoria, decisão, hash</text>
<text x="1230.0" y="396.0" text-anchor="middle" font-size="11">event=turn: latência e chamadas por conversa</text>
<text x="1230.0" y="410.0" text-anchor="middle" font-size="11">nunca o texto da conversa</text>
<rect x="1100" y="440" width="260" height="70" rx="8" fill="#E8F5EE" stroke="#1F7A4D"/>
<text x="1230.0" y="465.0" text-anchor="middle" font-size="11" font-weight="bold">Red team: 131 casos, 13 categorias</text>
<text x="1230.0" y="479.0" text-anchor="middle" font-size="11">roda sem modelo · todas as metas</text>
<text x="1230.0" y="493.0" text-anchor="middle" font-size="11">0% de falso positivo (48 legítimas)</text>
<rect x="1100" y="525" width="260" height="80" rx="8" fill="#E8F5EE" stroke="#1F7A4D"/>
<text x="1230.0" y="548.0" text-anchor="middle" font-size="11" font-weight="bold">Avaliação de qualidade: 28 conversas</text>
<text x="1230.0" y="562.0" text-anchor="middle" font-size="11">números no payload 13/13 · faixa V 3/3</text>
<text x="1230.0" y="576.0" text-anchor="middle" font-size="11">contrafactual (gênero, idade, cidade):</text>
<text x="1230.0" y="590.0" text-anchor="middle" font-size="11">decisões idênticas, tom equivalente</text>
<rect x="1100" y="620" width="260" height="65" rx="8" fill="#E8F5EE" stroke="#1F7A4D"/>
<text x="1230.0" y="642.5" text-anchor="middle" font-size="11" font-weight="bold">Experimentação: revisões com tag</text>
<text x="1230.0" y="656.5" text-anchor="middle" font-size="11">no Cloud Run, tráfego 10% → 100%</text>
<text x="1230.0" y="670.5" text-anchor="middle" font-size="11">métricas do log, guardrails como freio</text>
<rect x="40" y="345" width="260" height="55" rx="8" fill="#EAF1FB" stroke="#2F5FA3" stroke-dasharray="6,4"/>
<text x="170.0" y="369.5" text-anchor="middle" font-size="11" font-weight="bold">Pub/Sub + Cloud Scheduler</text>
<text x="170.0" y="383.5" text-anchor="middle" font-size="11">rotina do gatilho e evento de abertura</text>
<rect x="40" y="415" width="260" height="55" rx="8" fill="#EAF1FB" stroke="#2F5FA3" stroke-dasharray="6,4"/>
<text x="170.0" y="439.5" text-anchor="middle" font-size="11" font-weight="bold">Agent Engine</text>
<text x="170.0" y="453.5" text-anchor="middle" font-size="11">sessões e Memory Bank gerenciados</text>
<rect x="40" y="485" width="260" height="55" rx="8" fill="#EAF1FB" stroke="#2F5FA3" stroke-dasharray="6,4"/>
<text x="170.0" y="509.5" text-anchor="middle" font-size="11" font-weight="bold">RAG Engine / Vertex AI Search</text>
<text x="170.0" y="523.5" text-anchor="middle" font-size="11">mesma interface do corpus local</text>
<rect x="40" y="555" width="260" height="55" rx="8" fill="#EAF1FB" stroke="#2F5FA3" stroke-dasharray="6,4"/>
<text x="170.0" y="579.5" text-anchor="middle" font-size="11" font-weight="bold">BigQuery ao vivo</text>
<text x="170.0" y="593.5" text-anchor="middle" font-size="11">no lugar do snapshot</text>
